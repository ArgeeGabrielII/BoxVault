name: Firebase Spark Mock Dashboard CI/CD

on:
  pull_request:
    paths: ['apps/web/**', 'packages/assets/**', 'infrastructure/firebase/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'firebase.json', '.firebaserc', '.github/workflows/firebase-spark.yml']
  push:
    branches: [main]
    paths: ['apps/web/**', 'packages/assets/**', 'infrastructure/firebase/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'firebase.json', '.firebaserc', '.github/workflows/firebase-spark.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-spark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.18.0'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck mock dashboard
        run: pnpm --filter @boxvault/web typecheck
      - name: Build mock dashboard
        run: pnpm --filter @boxvault/web build
      - name: Audit release artifact
        run: node infrastructure/firebase/verify-preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: approved-mock-dashboard
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 1

  deploy-firebase:
    if: github.ref == 'refs/heads/main' && vars.FIREBASE_SPARK_DEPLOY_ENABLED == 'true'
    needs: validate-static
    runs-on: ubuntu-latest
    environment: firebase-spark-public
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: approved-mock-dashboard
          path: apps/web/dist/
      - name: Verify exact deploy artifact and project ID
        env:
          FIREBASE_SPARK_PROJECT_ID: ${{ vars.FIREBASE_SPARK_PROJECT_ID }}
        run: |
          test "$FIREBASE_SPARK_PROJECT_ID" = "boxvault-argee-2026" || exit 1
          [[ "$FIREBASE_SPARK_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,29}$ ]] || exit 1
          node infrastructure/firebase/verify-preview.mjs
      - name: Authenticate dedicated Firebase deploy service account
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SPARK_DEPLOY_SA_JSON }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Refuse deployment if billing attached or unverifiable
        env:
          FIREBASE_SPARK_PROJECT_ID: ${{ vars.FIREBASE_SPARK_PROJECT_ID }}
        run: BILLING_ACCESS_TOKEN="$(gcloud auth print-access-token)" node apps/public-site/scripts/assert-spark.mjs
      - name: Deploy Hosting live only
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SPARK_DEPLOY_SA_JSON }}
          projectId: ${{ vars.FIREBASE_SPARK_PROJECT_ID }}
          channelId: live
          entryPoint: .
