name: M1 Generate Prisma Baseline SQL

on:
  push:
    branches:
      - feat/m1-auth-tenant-acl-rls
    paths:
      - ".github/workflows/m1-prisma-baseline.yml"
      - "apps/api/prisma/schema.prisma"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/boxvault
      DIRECT_URL: postgresql://test:test@localhost:5432/boxvault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.18.0"
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Generate canonical baseline DDL without database connection
        run: cd apps/api && pnpm exec prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > generated-m1-baseline.sql
      - name: Confirm output is nonempty
        run: test -s apps/api/generated-m1-baseline.sql
      - name: Upload generated SQL for security review
        uses: actions/upload-artifact@v4
        with:
          name: m1-prisma-baseline-sql
          path: apps/api/generated-m1-baseline.sql
          retention-days: 3
