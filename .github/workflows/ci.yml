name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.18.0'
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: QR package regression tests
        run: pnpm --filter @boxvault/qr test
      - name: Developer Playground typecheck (mock-only)
        run: pnpm --filter @boxvault/playground typecheck
      - name: Developer Playground standalone build
        run: pnpm --filter @boxvault/playground build
