name: BoxVault
options:
  bundleIdPrefix: ph.boxvault
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  BoxVault:
    type: application
    platform: iOS
    sources:
      - path: BoxVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ph.boxvault.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BoxVault
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan QR codes on storage containers.
        INFOPLIST_KEY_NFCReaderUsageDescription: Read NFC labels attached to storage containers.
        CODE_SIGN_STYLE: Automatic
    info:
      path: BoxVault/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: ph.boxvault.app
            CFBundleURLSchemes: [boxvault]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: Scan QR labels attached to containers.
        NFCReaderUsageDescription: Read NFC tags attached to containers.
